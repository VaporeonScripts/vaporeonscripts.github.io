name: Update Spotify Now Playing

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Spotify status
        env:
          CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          TOKEN_RESPONSE=$(curl -s -X POST https://accounts.spotify.com/api/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d grant_type=refresh_token \
            -d refresh_token="$REFRESH_TOKEN" \
            -u "$CLIENT_ID:$CLIENT_SECRET")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Token refresh failed. Spotify said:"
            echo "$TOKEN_RESPONSE" | jq -r '.error, .error_description' 2>/dev/null || echo "$TOKEN_RESPONSE"
            exit 1
          fi

          CURRENT=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $ACCESS_TOKEN" https://api.spotify.com/v1/me/player/currently-playing)
          CURRENT_BODY=$(echo "$CURRENT" | sed '$d')
          CURRENT_CODE=$(echo "$CURRENT" | tail -n1)

          if [ "$CURRENT_CODE" = "200" ] && [ "$(echo "$CURRENT_BODY" | jq -r '.is_playing // false')" = "true" ]; then
            echo "$CURRENT_BODY" | jq '{
              is_playing: true,
              title: .item.name,
              artist: (.item.artists | map(.name) | join(", ")),
              album_art: .item.album.images[0].url,
              url: .item.external_urls.spotify,
              updated_at: (now | todate)
            }' > now-playing.json
          else
            RECENT=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" "https://api.spotify.com/v1/me/player/recently-played?limit=1")
            if [ "$(echo "$RECENT" | jq -r '.items | length')" = "0" ]; then
              echo "No recently played tracks returned. Raw response:"
              echo "$RECENT"
              exit 1
            fi
            echo "$RECENT" | jq '{
              is_playing: false,
              title: .items[0].track.name,
              artist: (.items[0].track.artists | map(.name) | join(", ")),
              album_art: .items[0].track.album.images[0].url,
              url: .items[0].track.external_urls.spotify,
              updated_at: (now | todate)
            }' > now-playing.json
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add now-playing.json
          git diff --staged --quiet || git commit -m "Update now-playing"
          git push
