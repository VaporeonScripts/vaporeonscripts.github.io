<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spotify Auth Callback</title>
</head>
<body style="font-family:monospace; background:#0a0a0a; color:#eee; padding:40px; max-width:600px; margin:0 auto;">
<h2>Copy this code, then exchange it quickly — it expires in a few minutes:</h2>
<p id="code" style="word-break:break-all; background:#1a1a1a; padding:16px; border-radius:8px; font-size:14px;"></p>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('code').textContent = params.get('code') || 'No code found in URL — did authorization fail?';
</script>
</body>
</html>
